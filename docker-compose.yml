services:
  backend:
    build: ./backend
    container_name: deepseek-ocr-backend
    runtime: nvidia
    ipc: host
    env_file:
      - .env
    environment:
      MODEL_NAME: ${MODEL_NAME:-/models/DeepSeek-OCR}
      HF_HOME: ${HF_HOME:-/models}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-100}
      HF_HUB_OFFLINE: "1"
      # NVIDIA_VISIBLE_DEVICES controls which host GPU(s) are exposed to the container
      # The exposed GPU will be remapped to cuda:0 inside the container
      NVIDIA_VISIBLE_DEVICES: "4"
      # PyTorch CUDA memory allocator configuration
      # Removed expandable_segments as it conflicts with some operations
      PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:512"
    volumes:
      - /data/model:/models
      - ./backend:/app
    privileged: true
    shm_size: "4g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    networks:
      - ocr-network

  frontend:
    build: ./frontend
    container_name: deepseek-ocr-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - ocr-network

networks:
  ocr-network:
    driver: bridge

